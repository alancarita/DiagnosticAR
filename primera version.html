<!DOCTYPE html>

<html lang="es"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <title>Soporte Técnico ATMs</title>
    <style>
        body { font-family: Arial; background: #1a1a1a; color: white; text-align: center; }
        .menu { display: flex; justify-content: center; gap: 20px; margin-top: 50px; }
        .boton-atm { 
            padding: 30px; border: 2px solid #0055aa; border-radius: 12px; 
            cursor: pointer; background: #2a2a2a; font-weight: bold;
        }
        .boton-atm:hover { background: #0055aa; }
        #visor { margin-top: 40px; border-top: 2px solid #444; padding-top: 20px; }
        .oculto { display: none; }
    </style>
</head>
<body>

    <h1>Manual Interactivo de ATMs</h1>
    <p>Seleccioná el equipo para ver Layout de Sensores y Actuadores</p>

    <div class="menu">
        <div class="boton-atm" onclick="seleccionar(&#39;MX5700&#39;)">MX5700</div>
        <div class="boton-atm" onclick="seleccionar(&#39;MS500AR&#39;)">MS500AR</div>
        <div class="boton-atm" onclick="seleccionar(&#39;BT6000&#39;)">BT6000</div>
    </div>

    <div id="visor" class="">
        <h2 id="titulo-modelo">Viendo: BT6000</h2>
        <button onclick="alert(&#39;Aquí cargaremos la foto del sensor layout&#39;)">Ver Sensores</button>
        <button onclick="alert(&#39;Aquí cargaremos la foto del actuador layout&#39;)">Ver Actuadores</button>
    </div>

    <script>
        function seleccionar(nombre) {
            document.getElementById('visor').classList.remove('oculto');
            document.getElementById('titulo-modelo').innerText = "Viendo: " + nombre;
        }
    </script>


</body></html>
